function downloadFile(name,txt,type){try{const url=URL.createObjectURL(new Blob([txt],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return true}catch(e){toast('Download blocked. Use Copy.');return false}}
function markBackup(){store.meta.lastBackup=todayStr();save();if(tab==='system')render()}
const backupText=()=>JSON.stringify(Object.assign({},store,{exportedAt:new Date().toISOString(),app:'system-veil'}));
function exportCSV(){const q=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v;const rows=[['date','type','item','detail','set','kg','reps_or_value']];
 [...store.sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{s.entries.forEach(e=>{const x=EX[e.exId]||{en:e.exId,ja:''};e.sets.forEach((st,j)=>rows.push([s.date,typeName(s.type),x.en,x.ja,j+1,st.w,st.r]))});(s.cardio||[]).forEach(c=>rows.push([s.date,'Cardio',c.m,'','','',c.min]))});
 Object.keys(store.days).sort().forEach(d=>{const x=store.days[d];if(num(x.vocal&&x.vocal.min))rows.push([d,'Quest','Vocal training','min','','',x.vocal.min]);if(x.creatine)rows.push([d,'Quest','Creatine','','','',1]);if(x.protein)rows.push([d,'Quest','Protein','g','','',num(x.protein.g)]);(x.cardio||[]).forEach(c=>rows.push([d,'Cardio',c.m,'','','',c.min]))});
 downloadFile(`system-veil-${todayStr()}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')}
function handleImport(txt){let o;try{o=JSON.parse(txt)}catch(e){toast('Not a valid backup.');return}if(!o||!Array.isArray(o.sessions)){toast('Backup not recognized.');return}
 const isSV=o.app==='system-veil'||o.profile;
 confirmSheet(isSV?`Replace ALL current data with this System Veil backup (${o.sessions.length} sessions)?`:`Import ${o.sessions.length} sessions from a Lean Build backup? Your current workout log is replaced; quests, profile and story are kept.`,'Import',()=>{
  if(isSV){store=migrate(o)}else{store.sessions=o.sessions;store.bw=o.bw||store.bw;store.startDate=o.startDate||store.startDate}
  save();recompute();if(G){store.meta.seenL=G.lv.L;store.meta.seenR=G.rank.r;store.meta.seenB=Object.keys(G.earned);store.meta.seenStory=G.story.map(s=>s.id)}save();tab='quests';render();toast('Restored ✓')},true)}

document.addEventListener('click',async ev=>{

 switch(a){

   save();awk.step=PROLOGUE.length+3;$('#view').innerHTML=viewAwaken();scrollTo(0,0);SFX.level();break}
  case 'awkdone':tab='quests';render();scrollTo(0,0);

   const s1=G.story.find(x=>x.id==='w1i');if(s1)popup({head:'NEW ENEMY',icon:'sword',sfx:'msg',html:`<p class="tiny" style="letter-spacing:.2em;color:var(--glow)">${esc(s1.title.toUpperCase())}</p><div class="msg">${esc(fx(s1.text))}</div>`,btn:'Begin'});
   break;

  case 'done':{const st=d.entries[i].sets[s];if(!st.done&&!(num(st.r)>0)){toast('Enter reps first');const inp=document.querySelector(`input[data-f="r"][data-i="${i}"][data-s="${s}"]`);inp&&inp.focus();return}
   st.done=!st.done;if(st.done){const nx=d.entries[i].sets[s+1];if(nx&&(nx.w===''||nx.w==null))nx.w=st.w;if(store.settings.autoTimer)startTimer(d.entries[i].rest);buzz(30)}save();render();break}

async function shareCard(){toast('Rendering status card…');const cv=await makeShareCard();const url=cv.toDataURL('image/png');
 openSheet(`<div class="row" style="align-items:center"><h2 style="margin:0">Status card</h2><button class="ng" data-act="closesheet">Close</button></div><img src="${url}" style="width:100%;border:1px solid var(--line);margin:10px 0" alt="Status card"><p class="tiny muted">Tip: long-press the image to save it on iPhone.</p><div class="row"><button class="pri" data-act="cardshare">Share</button><button data-act="carddl">Download</button></div>`);
 shareCard.cv=cv}
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='sharecard')shareCard();
 if(a==='cardshare'||a==='carddl'){const cv=shareCard.cv;if(!cv)return;cv.toBlob(async bl=>{const f=new File([bl],`system-veil-${todayStr()}.png`,{type:'image/png'});if(a==='cardshare'&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'System Veil'})}catch(e){}}else{const u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download=f.name;document.body.appendChild(l);l.click();l.remove()}},'image/png')}
});
/* ---------- Asset Forge (art prompts) ---------- */
function viewForge(){
 const grp={1:'Priority 1 · Companion portraits (needed for cards)',2:'Priority 2 · Alt outfits & bond illustrations',3:'Priority 3 · Bosses & key art'};
 return `<section class="win"><div class="wt">Asset Forge</div><p class="small">Generate these with an image AI, then send the images back to Claude to install. Paste the <b>master prompt</b> first, then one image prompt at a time.</p><button class="pri" data-act="copymaster" style="width:100%">Copy master prompt</button>
 ${[1,2,3].map(p=>`<h3>${grp[p]}</h3>`+ASSETS.map((a,i)=>a.pri!==p?'':`<div class="forge"><div class="fth"><img src="assets/${a.file}.webp" alt="" loading="lazy" onerror="this.parentNode.classList.add('miss');this.remove()"></div><div style="flex:1;min-width:0"><div class="small"><b>${esc(a.use)}</b></div><div class="tiny muted mono">${a.file}.png · ${a.size}</div></div><button class="ng" data-act="copyprompt" data-i="${i}">Copy</button></div>`).join('')).join('')}</section>`;
}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied ✓')}catch(e){openSheet(`<h2>Copy this prompt</h2><textarea readonly style="min-height:260px">${esc(t)}</textarea><button data-act="closesheet" style="width:100%;margin-top:8px">Done</button>`)}}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='copymaster')copyText(MASTER_PROMPT);
 if(a==='copyprompt')copyText(ASSETS[+b.dataset.i].prompt);
 if(a==='sqseg'){sqSeg=b.dataset.s;render()}
 if(a==='pull'){unlockAudio();doPull(+b.dataset.n)}
 if(a==='compinfo')compInfo(b.dataset.id);
 if(a==='setlead'){store.settings.lead=b.dataset.id;save();closeSheet();render();toast('Lead companion set')}
 if(a==='togalt'){store.equip.alts=store.equip.alts||{};store.equip.alts[b.dataset.id]=!store.equip.alts[b.dataset.id];save();compInfo(b.dataset.id);render()}
 if(a==='gift'){const id=b.dataset.id,g=b.dataset.g;const before=bondInfo(id).L;store.giftUse.push({ts:Date.now(),g,c:id});save();recompute();const after=bondInfo(id).L;tone([[880,0],[1320,.1,.3]]);floatText([{t:`+${GIFTS[g].xp} bond`,c:compById(id).col}]);compInfo(id);render();if(after>before)popup({head:'BOND LEVEL UP',icon:'users',sfx:'level',burst:true,html:`<div class="bign">${after}</div><p style="text-align:center">${esc(compById(id).n)} · Bond Lv ${after}</p>${BOND_UNLOCK[after]?`<p class="small" style="text-align:center;color:var(--glow2)">Unlocked: ${BOND_UNLOCK[after]}</p>`:''}`})}
 if(a==='equip'){store.equip[b.dataset.k]=b.dataset.id;save();applyTheme();render()}
 if(a==='beast'){const w=+b.dataset.w,bt=G.battles[w],sw=storyWeek(w);openSheet(`<div class="row" style="align-items:center"><h2 style="margin:0">${esc(bossName(w))}</h2><button class="ng" data-act="closesheet">Close</button></div><p class="tiny muted">Week ${w} · ${esc(w<=52?sw[1]:'Echo')} · ${bt.res==='win'?'Defeated':'Escaped'} · ${bt.dmg}/${bt.max} damage</p>${BOSSART[w]?`<div class="bondart" style="aspect-ratio:1">${art(BOSSART[w],`<div class="bossph">${bossSigil(w,120)}</div>`)}</div>`:''}<div class="log"><div class="tx">${esc(fx(w<=52?sw[2]:'An echo of an old enemy.'))}</div></div><div class="log"><div class="tx">${esc(fx(w<=52?sw[bt.res==='win'?4:5]:''))}</div></div>`)}
 if(a==='skin'){const x=dayRec(todayStr());x.skin=x.skin||{};x.skin[b.dataset.k]=!x.skin[b.dataset.k];commit(x.skin.am&&(x.skin.pm||!store.settings.skinPM)?'Skincare complete':'')}
 if(a==='stretchquick'){const x=dayRec(todayStr());if(x.stretch&&x.stretch.done)delete x.stretch;else x.stretch={done:true,early:new Date().getHours()<10};commit(x.stretch?'Morning Stretch complete':'')}
});
/* precache art so it works offline */
function precacheArt(){if(!('caches' in window)||!location.protocol.startsWith('http'))return;caches.open('leanbuild-v1').then(c=>ASSETS.forEach(a=>c.add(`assets/${a.file}.webp`).catch(()=>{}))).catch(()=>{})}

/* =================== BOOT, DAILY INTRO, AWAY REPORT =================== */
function dailyIntro(){
 const t=G.today,R=G.daily[t];if(store.meta.introDate===t)return;
 const last=store.meta.lastOpen;store.meta.introDate=t;
 if(last&&last<t){let missed=0,dec={},ev=[];for(let n=dayNum(last)+1;n<G.tN;n++){const r=G.daily[dStr(n)];if(!r)continue;if(r.missed)missed++;(r.decay||[]).forEach(k=>dec[k]=(dec[k]||0)+r.g[k]);ev.push(...r.ev.filter(e=>/Shield|broken/.test(e)))}
  if(missed||Object.keys(dec).length)popup({head:'WHILE YOU WERE AWAY',icon:'warn',sfx:'warn',html:`${missed?`<p>${missed} day${missed>1?'s':''} of daily quests were missed.</p>`:''}${ev.map(e=>`<div class="small muted">› ${esc(e)}</div>`).join('')}${Object.keys(dec).length?`<h3>Atrophy</h3><div>${SKEYS.filter(k=>dec[k]).map(k=>`<span class="rw" style="color:var(--bad);border-color:var(--bad)">${k} ${r2(dec[k])}</span>`).join('')}</div><p class="small muted">Lost points return faster when you resume (muscle memory).</p>`:''}<p class="small">HP ${Math.round(G.hp*G.maxHP)} / ${G.maxHP}. Today is a fresh start.</p>`,btn:'Resume'})}
 store.meta.lastOpen=t;
 const names={stretch:'Morning Stretch · 6 min',skin:'Skincare · morning + night',main:R.type==='rest'?'Recovery Protocol':R.type==='bw'?'Calisthenics session':'Strength Training: '+PLAN[nextGym()].name,vocal:`Vocal training · ${store.settings.vocalTarget} min`,creatine:'Creatine',protein:`Protein · ${proteinTarget(G.bodyKg)} g`};
 const b=G.battles[G.cw];
 popup({head:'DAILY QUESTS HAVE ARRIVED',icon:'quest',sfx:'msg',html:`<p class="tiny muted" style="letter-spacing:.2em">${fmtDate(t).toUpperCase()} · ${TYPE_LABEL[R.type].toUpperCase()}</p>${R.req.map(k=>`<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)">${ic({main:R.type==='rest'?'moon':'str',vocal:'mic',creatine:'flask',protein:'shaker',stretch:'stretch',skin:'drop'}[k],16)} ${esc(names[k])}</div>`).join('')}<p class="small" style="margin-top:10px">Reward: <b>+60 EXP</b>, streak, HP. <span class="muted">Missing them costs HP.</span></p><p class="small" style="color:#ff9fb0">${ic('sword',14)} ${esc(bossName(G.cw))}: ${Math.round(Math.max(0,b.max-b.dmg)/b.max*100)}% HP left</p>`,btn:'Accept'});
 save();
}
function checkRollover(){if(!store.profile||!G)return;if(G.today!==todayStr()){const b=G;recompute();notifyDiff(b,G);dailyIntro();render()}}
setInterval(checkRollover,60000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').then(()=>{try{caches.open('leanbuild-v1').then(c=>c.add(location.href.split('#')[0])).catch(()=>{})}catch(e){}}).catch(()=>{})}
(function boot(){
 if(store.profile){recompute();const b=null;notifyDiff(b,G);dailyIntro()}
 precacheArt();
 render();runTyped();
})();
</script>
